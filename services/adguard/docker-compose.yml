services:
  adguard:
    image: adguard/adguardhome:latest
    container_name: chae-adguard
    restart: unless-stopped
    ports:
      - "0.0.0.0:53:53/tcp"
      - "0.0.0.0:53:53/udp"
      - "3002:3000/tcp"
    volumes:
      - ./conf:/opt/adguardhome/conf
      - ./work:/opt/adguardhome/work
    networks:
      - qbittorrent_default

networks:
  qbittorrent_default:
    external: true
    name: qbittorrent_default

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: chae-flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    ports:
      - "127.0.0.1:8191:8191"
    networks:
      - qbittorrent_default

networks:
  qbittorrent_default:
    external: true

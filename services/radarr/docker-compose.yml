services:
  radarr:
    image: lscr.io/linuxserver/radarr@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
    container_name: chae-radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT:-/mnt/media}:/media
      - ${DOWNLOADS_ROOT:-/mnt/media2/downloads}:/downloads
    ports:
      - "127.0.0.1:7878:7878"
      - "${MEDIA_SERVER_IP:-192.168.0.200}:7878:7878"
    networks:
      - qbittorrent_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  qbittorrent_default:
    external: true

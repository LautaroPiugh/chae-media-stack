services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: chae-dozzle
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${MEDIA_SERVER_IP:-192.168.0.200}:8081:8080"
      - "127.0.0.1:8081:8080"
    networks:
      - qbittorrent_default
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  qbittorrent_default:
    external: true

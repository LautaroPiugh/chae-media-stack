services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:6660787a99b2e58203539583663c973b48979fc00ff2cb78dc0ea17429e1f6ef
    container_name: chae-prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config:/config
    ports:
      - "127.0.0.1:9696:9696"
      - "${MEDIA_SERVER_IP:-192.168.0.200}:9696:9696"
    networks:
      - qbittorrent_default
      - prowlarr_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  qbittorrent_default:
    external: true
  prowlarr_default:
    external: true

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr@sha256:1295cff29d10b486c0d8324d1559a552140a5932bf8b3d87e398654414f63f92
    container_name: chae-prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
    volumes:
      - ./config:/config
    ports:
      - "127.0.0.1:9696:9696"
      - "${MEDIA_SERVER_IP:-192.168.1.100}:9696:9696"
    networks:
      - qbittorrent_default
      - prowlarr_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  qbittorrent_default:
    external: true
  prowlarr_default:
    external: true

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr@sha256:f247545d23ba8b233d6604575347e48a623fe6ad75dda02348bf81917f3b5c06
    container_name: chae-sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT:-/mnt/media}:/media
    ports:
      - "127.0.0.1:8989:8989"
      - "${MEDIA_SERVER_IP:-192.168.0.200}:8989:8989"
    networks:
      - qbittorrent_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  qbittorrent_default:
    external: true

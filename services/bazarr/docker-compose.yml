services:
  bazarr:
    # Bazarr+ (LavX/bazarr) — fork de Bazarr con Provider Hub Marketplace
    # (da acceso a OpenSubtitles.org sin API key ni VIP vía FlareSolverr).
    # Pinneada por digest como el resto del stack. Rollback:
    #   services/bazarr/ROLLBACK-BAZARRPLUS.txt
    image: ghcr.io/lavx/bazarr@sha256:9ce6db2e5453f78ebc9aae53520f6e5813e80cd96595a58279c7cef6c9111bd2
    container_name: chae-bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT:-/opt/media}:/media
    ports:
      - "127.0.0.1:6767:6767"
      - "${MEDIA_SERVER_IP:-192.168.1.100}:6767:6767"
    networks:
      - qbittorrent_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  qbittorrent_default:
    external: true

services:
  bazarr:
    image: lscr.io/linuxserver/bazarr@sha256:b3d44d324399152be4d50775ff639a364c0fa1cfda67f71b1f38264c4d0ca09f
    container_name: chae-bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config:/config
      - ${MEDIA_ROOT:-/opt/media}:/media
    ports:
      - "127.0.0.1:6767:6767"
      - "${MEDIA_SERVER_IP:-192.168.1.100}:6767:6767"
    networks:
      - qbittorrent_default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/ping"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  qbittorrent_default:
    external: true

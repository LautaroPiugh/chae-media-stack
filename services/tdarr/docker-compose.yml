services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr@sha256:45742f00e51a58553844c8b13d97e7ae9b2ee9a056bd8e5993d9a8282a45a23f
    container_name: chae-tdarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - UMASK_SET=022
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=false
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=chae-tdarr-server
      - auth=false
      - openBrowser=false
      - maxLogSizeMB=10
    volumes:
      - ./server:/app/server
      - ./configs:/app/configs
      - ./logs:/app/logs
      - /mnt/media:/media
      - /mnt/media2/downloads:/downloads
      - /mnt/media2/downloads/tdarr-cache:/temp
    ports:
      - "127.0.0.1:8265:8265"
      - "${MEDIA_SERVER_IP:-192.168.1.100}:8265:8265"
    networks:
      - qbittorrent_default
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "107"
    mem_limit: 2g

  tdarr-node:
    image: ghcr.io/haveagitgat/tdarr_node@sha256:7542459ac5ed5cd299600530e9625b9d590629d5dc391c0016773f5d6aa3fe75
    container_name: chae-tdarr-node
    restart: unless-stopped
    depends_on:
      - tdarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Argentina/Buenos_Aires
      - UMASK_SET=022
      - nodeName=chae-tdarr-node
      - serverIP=chae-tdarr
      - serverPort=8266
      - inContainer=true
      - ffmpegVersion=7
      - nodeType=mapped
      - priority=-1
      - maxLogSizeMB=10
      - pollInterval=2000
      - startPaused=false
      - transcodegpuWorkers=1
      - transcodecpuWorkers=1
      - healthcheckgpuWorkers=0
      - healthcheckcpuWorkers=1
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - /mnt/media:/media
      - /mnt/media2/downloads:/downloads
      - /mnt/media2/downloads/tdarr-cache:/temp
    networks:
      - qbittorrent_default
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "107"
    mem_limit: 8g

networks:
  qbittorrent_default:
    external: true

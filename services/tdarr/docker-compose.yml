services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr@sha256:e06ecd0a5fc27ab248622f61b59b5ab1d797d8249a3a6e12f2bcce6decfebd8c
    container_name: chae-tdarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - UMASK_SET=022
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=false
      - inContainer=true
      - ffmpegVersion=7
      - nodeName=chae-tdarr-server
      - auth=false
      - openBrowser=false
      - maxLogSizeMB=10
    volumes:
      - ./server:/app/server
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ${MEDIA_ROOT:-/mnt/media}:/media
      - ${DOWNLOADS_ROOT:-/mnt/media2/downloads}:/downloads
      - ${DOWNLOADS_ROOT:-/mnt/media2/downloads}/tdarr-cache:/temp
    ports:
      - "127.0.0.1:8265:8265"
      - "${MEDIA_SERVER_IP:-192.168.0.200}:8265:8265"
    networks:
      - qbittorrent_default
    mem_limit: 2g

  tdarr-node:
    image: ghcr.io/haveagitgat/tdarr_node@sha256:5493c345c3bfc13e107985ae702b0157897f3e1697bc1120af2798ba3f4d520a
    container_name: chae-tdarr-node
    restart: unless-stopped
    depends_on:
      - tdarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - UMASK_SET=022
      - nodeName=chae-tdarr-node
      - serverIP=chae-tdarr
      - serverPort=8266
      - inContainer=true
      - ffmpegVersion=7
      - nodeType=mapped
      - priority=-1
      - maxLogSizeMB=10
      - pollInterval=2000
      - startPaused=false
      - transcodegpuWorkers=1
      - transcodecpuWorkers=1
      - healthcheckgpuWorkers=0
      - healthcheckcpuWorkers=1
    volumes:
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ${MEDIA_ROOT:-/mnt/media}:/media
      - ${DOWNLOADS_ROOT:-/mnt/media2/downloads}:/downloads
      - ${DOWNLOADS_ROOT:-/mnt/media2/downloads}/tdarr-cache:/temp
    networks:
      - qbittorrent_default
    mem_limit: 8g

networks:
  qbittorrent_default:
    external: true

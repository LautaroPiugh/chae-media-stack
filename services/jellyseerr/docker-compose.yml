services:
  jellyseerr:
    image: ghcr.io/seerr-team/seerr@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    init: true
    container_name: chae-jellyseerr
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config:/app/config
    ports:
      - "127.0.0.1:5055:5055"
      - "${MEDIA_SERVER_IP:-192.168.0.200}:5055:5055"
    networks:
      - qbittorrent_default
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5055/api/v1/status"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  qbittorrent_default:
    external: true

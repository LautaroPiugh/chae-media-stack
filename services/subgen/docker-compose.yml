services:
  subgenai:
    image: 'mccloud/subgen@sha256:2841515a3b409677669f0a10d77d49160bffb8111db91640fb33a4db06b3396c'
    container_name: subgenai
    restart: unless-stopped
    volumes:
      - './models:/subgen/models'
      - './subgen.env:/subgen/subgen.env:ro'
      - '${MEDIA_ROOT:-/mnt/media}:/media:ro'
    environment:
      LOG_LEVEL: debug
      NAME_SERVERS: 9.9.9.9
      PROCADDEDMEDIA: false
      PROCMEDIAONPLAY: false
      CONCURRENT_TRANSCRIPTIONS: 2
      USE_PATH_MAPPING: false
      MODEL_PATH: ./models
    ports:
      - "127.0.0.1:9000:9000"
      - "${MEDIA_SERVER_IP:-192.168.0.200}:9000:9000"
    mem_limit: 8g
    networks:
      # Bazarr (config.yaml, whisperai.endpoint) llama a http://subgenai:9000.
      # Sin esta red compartida, subgenai queda en su bridge implicito
      # (subgen_default) y Bazarr no lo resuelve: la generacion de subtitulos
      # con Whisper no podia funcionar.
      - qbittorrent_default

networks:
  qbittorrent_default:
    external: true

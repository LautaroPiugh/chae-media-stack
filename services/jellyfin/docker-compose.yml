services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest@sha256:b0b6d034aa52ed6e1a76daaa3d7ed29039d2b802a50fa8ffd1d9fc8d3fd836c7
    container_name: chae-jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - JELLYFIN_PublishedServerUri=http://${MEDIA_SERVER_IP:-192.168.0.200}:8096
    volumes:
      - ./config:/config
      - ./theme/scyfin-theme.css:/usr/share/jellyfin/web/scyfin-theme.css:ro
      - ./theme/theme-oled.css:/usr/share/jellyfin/web/theme-oled.css:ro
      - ${MEDIA_ROOT:-/mnt/media}:/media:ro
    ports:
      - "127.0.0.1:8096:8096"
      - "${MEDIA_SERVER_IP:-192.168.0.200}:8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    external: true
    name: jellyfin_default

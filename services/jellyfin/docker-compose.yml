services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11ubu2604-ls44@sha256:0dd18f8de37c7cfbe76877a8b928943b3588beb9678fb223121914ec9a3cdf7c
    container_name: chae-jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - JELLYFIN_PublishedServerUri=http://${MEDIA_SERVER_IP:-192.168.1.100}:8096
    volumes:
      - ./config:/config
      - ./theme/scyfin-theme.css:/usr/share/jellyfin/web/scyfin-theme.css:ro
      - ./theme/theme-oled.css:/usr/share/jellyfin/web/theme-oled.css:ro
      - ${MEDIA_ROOT:-/opt/media}:/media:ro
    ports:
      - "127.0.0.1:8096:8096"
      - "${MEDIA_SERVER_IP:-192.168.1.100}:8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    external: true
    name: jellyfin_default

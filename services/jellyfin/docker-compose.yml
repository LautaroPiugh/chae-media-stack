services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest@sha256:2f708001387aa9853e744a4a4d572d9970927c479c56d6c9e199f789c5173535
    container_name: chae-jellyfin
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config:/config
      - ./theme/scyfin-theme.css:/usr/share/jellyfin/web/scyfin-theme.css:ro
      - ./theme/theme-oled.css:/usr/share/jellyfin/web/theme-oled.css:ro
      - ${MEDIA_ROOT:-/mnt/media}:/media:ro
    ports:
      - "127.0.0.1:8096:8096"
      - "${MEDIA_SERVER_IP:-192.168.0.200}:8096:8096"
      - "100.117.55.30:8096:8096"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    external: true
    name: jellyfin_default

services:
  uptime-kuma:
    image: louislam/uptime-kuma@sha256:3d632903e6af34139a37f18055c4f1bfd9b7205ae1138f1e5e8940ddc1d176f9
    container_name: chae-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
      - "192.168.1.100:3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - UPTIME_KUMA_PORT=3001
      - TZ=America/Argentina/Buenos_Aires
    networks:
      - media
      - jellyfin

networks:
  media:
    external: true
    name: qbittorrent_default
  jellyfin:
    external: true
    name: jellyfin_default
